# Path B: Docker Compose deployment (P4-3, ARCHITECTURE.md §7).
#
# Plain HTTP is the default capture mode.
# TLS is enabled with TLS_ENABLED=true for the P4-6 defense-in-depth mode.

services:
  store:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ehr
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ehr"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - store-data:/var/lib/postgresql/data
    networks: [federation]

  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      store:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres@store:5432/ehr
    entrypoint: ["python", "-m", "storage.migrate"]
    networks: [federation]

  authority-med:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      SERVICE_ROLE: authority
      PORT: "8010"
      AUTHORITY_ID: authority-med
      OWNED_ATTRIBUTES: role
      TLS_ENABLED: "${TLS_ENABLED:-false}"
      SSL_CERTFILE: /tls/authority-med.crt
      SSL_KEYFILE: /tls/authority-med.key
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8010), 2).close()"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "8010:8010"
    networks: [federation]
    volumes:
      - ../wire/certs:/tls:ro

  authority-net:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      SERVICE_ROLE: authority
      PORT: "8011"
      AUTHORITY_ID: authority-net
      OWNED_ATTRIBUTES: "specialty,facility,owner"
      TLS_ENABLED: "${TLS_ENABLED:-false}"
      SSL_CERTFILE: /tls/authority-net.crt
      SSL_KEYFILE: /tls/authority-net.key
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8011), 2).close()"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "8011:8011"
    networks: [federation]
    volumes:
      - ../wire/certs:/tls:ro

  audit:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      store:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      SERVICE_ROLE: audit
      PORT: "8020"
      DATABASE_URL: postgresql://postgres@store:5432/ehr
      AUDIT_ACTOR_ID: audit-service
      TLS_ENABLED: "${TLS_ENABLED:-false}"
      SSL_CERTFILE: /tls/audit.crt
      SSL_KEYFILE: /tls/audit.key
      TLS_VERIFY: "${TLS_VERIFY:-true}"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8020), 2).close()"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "8020:8020"
    networks: [federation]
    volumes:
      - ../wire/certs:/tls:ro

  facility-a:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      store:
        condition: service_healthy
      audit:
        condition: service_healthy
    environment:
      SERVICE_ROLE: facility
      PORT: "8001"
      FACILITY_ID: facility-a
      DATABASE_URL: postgresql://postgres@store:5432/ehr
      AUDIT_SERVICE_URL: "${AUDIT_SERVICE_URL:-http://audit:8020}"
      TLS_ENABLED: "${TLS_ENABLED:-false}"
      SSL_CERTFILE: /tls/facility-a.crt
      SSL_KEYFILE: /tls/facility-a.key
      TLS_VERIFY: "${TLS_VERIFY:-true}"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8001), 2).close()"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "8001:8001"
    networks: [federation]
    volumes:
      - ../wire/certs:/tls:ro

  facility-b:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      store:
        condition: service_healthy
      audit:
        condition: service_healthy
    environment:
      SERVICE_ROLE: facility
      PORT: "8002"
      FACILITY_ID: facility-b
      DATABASE_URL: postgresql://postgres@store:5432/ehr
      AUDIT_SERVICE_URL: "${AUDIT_SERVICE_URL:-http://audit:8020}"
      TLS_ENABLED: "${TLS_ENABLED:-false}"
      SSL_CERTFILE: /tls/facility-b.crt
      SSL_KEYFILE: /tls/facility-b.key
      TLS_VERIFY: "${TLS_VERIFY:-true}"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8002), 2).close()"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "8002:8002"
    networks: [federation]
    volumes:
      - ../wire/certs:/tls:ro

  bootstrap:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    entrypoint: ["python", "-m", "deploy.compose_bootstrap"]
    depends_on:
      authority-med:
        condition: service_healthy
      authority-net:
        condition: service_healthy
      audit:
        condition: service_healthy
      facility-a:
        condition: service_healthy
      facility-b:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres@store:5432/ehr
      AUDIT_SERVICE_URL: "${AUDIT_SERVICE_URL:-https://audit:8020}"
      AUTHORITY_MED_URL: "${AUTHORITY_MED_URL:-https://authority-med:8010}"
      AUTHORITY_NET_URL: "${AUTHORITY_NET_URL:-https://authority-net:8011}"
      FACILITY_A_URL: "${FACILITY_A_URL:-https://facility-a:8001}"
      FACILITY_B_URL: "${FACILITY_B_URL:-https://facility-b:8002}"
      TLS_VERIFY: "${TLS_VERIFY:-true}"
    volumes:
      - ./pki:/pki
    networks: [federation]

networks:
  federation: {}

volumes:
  store-data: {}
