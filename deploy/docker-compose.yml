# Path B: Docker Compose deployment (P4-3, ARCHITECTURE.md §7).
#
# Plain HTTP is the default capture mode.
# TLS is enabled with TLS_ENABLED=true for the P4-6 defense-in-depth mode.
#
# The portal starts after bootstrap succeeds and is served at localhost:8000.
# Published database and service ports are restricted to loopback (review F16).
# This is a disposable local demo, not an internet-facing deployment.
# For verified federation TLS: python -m wire.tls, then TLS_ENABLED=true.
# Recreate the entire stack after key-service restarts; keys are ephemeral.
# The store requires POSTGRES_PASSWORD (deploy/.env, git-ignored). Each service
# mounts only its own TLS key plus the shared trust bundle (ADR-0047).
# The `pki` job writes the break-glass trust anchors before the facilities
# start; facilities refuse to start without them (review F1). It also issues
# every service its request-signing identity (ADR-0066): each container mounts
# only ./pki/services/<its id> plus the public ./pki/trust. The audit
# service verifies its chain at startup and everything that writes to it
# waits for it to be healthy (review F37).
#
# Every service keeps its keys in memory, so the federation is fresh whenever
# the stack starts (ADR-0039): the store lives in tmpfs and is empty on each
# start, and `bootstrap` seeds the synthetic dataset into it (SEED_DATA=false
# skips that). Re-running `up` on a running stack leaves it alone.
#
# With TLS_ENABLED=true the store serves TLS only (deploy/store-entrypoint.sh)
# and every client verifies it (sslmode=verify-full against
# wire/certs/trust/store.crt), so the facility-store link is encrypted too
# (ADR-0071).

services:
  store:
    image: postgres:16-alpine
    entrypoint: ["sh", "/store-entrypoint.sh"]
    environment:
      POSTGRES_DB: ehr
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env, see deploy/README.md}"
      TLS_ENABLED: "${TLS_ENABLED:-false}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ehr"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:55433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./store-entrypoint.sh:/store-entrypoint.sh:ro
      - ../wire/certs/store:/tls/store:ro
    networks: [federation]

  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      store:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres@store:5432/ehr
      PGPASSWORD: "${POSTGRES_PASSWORD}"
      TLS_ENABLED: "${TLS_ENABLED:-false}"
    entrypoint: ["python", "-m", "deploy.migrate"]
    volumes:
      - ../wire/certs/trust:/tls/trust:ro
    networks: [federation]

  # Generates the federation PKI before any facility starts: facilities load
  # the root and facility CA certificates at startup and never take them from
  # a request (review F1). Writes ./pki/federation-pki.json (private keys,
  # git-ignored, read only by bootstrap) and ./pki/trust/ (certificates only,
  # the one directory facilities mount).
  pki:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    entrypoint: ["python", "-m", "deploy.compose_pki"]
    user: root  # writes the host bind mount ./pki
    network_mode: none
    volumes:
      - ./pki:/pki

  authority-med:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      pki:
        condition: service_completed_successfully
    environment:
      HOST: "0.0.0.0"  # bind inside the bridge; host access below is loopback-only (F16)
      SERVICE_ROLE: authority
      PORT: "8010"
      AUTHORITY_ID: authority-med
      OWNED_ATTRIBUTES: role
      # Signed requests only; authoring keys go to facilities, the custodian
      # and bootstrap (ADR-0066, replacing the F14 address allowlist).
      SERVICE_KEY_FILE: /identity/service.key
      SERVICE_CERT_FILE: /identity/service.crt
      FEDERATION_ROOT_CERT: /trust/root.crt
      # A key goes only to a subject proving possession under these CAs (ADR-0082).
      FACILITY_CA_CERTS_DIR: /trust/facility-cas
      TLS_ENABLED: "${TLS_ENABLED:-false}"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8010), 2).close()"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:8010:8010"
    networks: [federation]
    volumes:
      - ../wire/certs/authority-med:/tls/authority-med:ro
      - ../wire/certs/trust:/tls/trust:ro
      - ./pki/services/authority-med:/identity:ro
      - ./pki/trust:/trust:ro

  authority-net:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      pki:
        condition: service_completed_successfully
    environment:
      HOST: "0.0.0.0"  # bind inside the bridge; host access below is loopback-only (F16)
      SERVICE_ROLE: authority
      PORT: "8011"
      AUTHORITY_ID: authority-net
      OWNED_ATTRIBUTES: "specialty,facility,owner"
      # Signed requests only; authoring keys go to facilities, the custodian
      # and bootstrap (ADR-0066, replacing the F14 address allowlist).
      SERVICE_KEY_FILE: /identity/service.key
      SERVICE_CERT_FILE: /identity/service.crt
      FEDERATION_ROOT_CERT: /trust/root.crt
      # A key goes only to a subject proving possession under these CAs (ADR-0082).
      FACILITY_CA_CERTS_DIR: /trust/facility-cas
      TLS_ENABLED: "${TLS_ENABLED:-false}"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8011), 2).close()"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:8011:8011"
    networks: [federation]
    volumes:
      - ../wire/certs/authority-net:/tls/authority-net:ro
      - ../wire/certs/trust:/tls/trust:ro
      - ./pki/services/authority-net:/identity:ro
      - ./pki/trust:/trust:ro

  audit:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      store:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      pki:
        condition: service_completed_successfully
    environment:
      HOST: "0.0.0.0"  # bind inside the bridge; host access below is loopback-only (F16)
      SERVICE_ROLE: audit
      PORT: "8020"
      DATABASE_URL: postgresql://postgres@store:5432/ehr
      PGPASSWORD: "${POSTGRES_PASSWORD}"
      AUDIT_ACTOR_ID: audit-service
      SERVICE_KEY_FILE: /identity/service.key
      SERVICE_CERT_FILE: /identity/service.crt
      FEDERATION_ROOT_CERT: /trust/root.crt
      # Share 3 is released only against an assertion validated here (ADR-0067).
      FACILITY_CA_CERTS_DIR: /trust/facility-cas
      TLS_ENABLED: "${TLS_ENABLED:-false}"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8020), 2).close()"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:8020:8020"
    networks: [federation]
    volumes:
      - ../wire/certs/audit:/tls/audit:ro
      - ../wire/certs/trust:/tls/trust:ro
      - ./pki/services/audit-service:/identity:ro
      - ./pki/trust:/trust:ro

  facility-a:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      store:
        condition: service_healthy
      audit:
        condition: service_healthy
      pki:
        condition: service_completed_successfully
    environment:
      HOST: "0.0.0.0"  # bind inside the bridge; host access below is loopback-only (F16)
      SERVICE_ROLE: facility
      PORT: "8001"
      FACILITY_ID: facility-a
      FEDERATION_ROOT_CERT: /trust/root.crt
      FACILITY_CA_CERTS_DIR: /trust/facility-cas
      DATABASE_URL: postgresql://postgres@store:5432/ehr
      PGPASSWORD: "${POSTGRES_PASSWORD}"
      AUDIT_SERVICE_URL: "${AUDIT_SERVICE_URL:-http://audit:8020}"
      # The forced rotation at expiry re-authors the policy at the
      # authorities and hands new shares to the custodian (ADR-0069).
      AUTHORITY_URLS: "${AUTHORITY_URLS:-authority-med=http://authority-med:8010,authority-net=http://authority-net:8011}"
      CUSTODIAN_URL: "${CUSTODIAN_URL:-http://custodian:8030}"
      SERVICE_KEY_FILE: /identity/service.key
      SERVICE_CERT_FILE: /identity/service.crt
      TLS_ENABLED: "${TLS_ENABLED:-false}"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8001), 2).close()"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:8001:8001"
    networks: [federation]
    volumes:
      - ../wire/certs/facility-a:/tls/facility-a:ro
      - ../wire/certs/trust:/tls/trust:ro
      - ./pki/trust:/trust:ro
      - ./pki/services/facility-a:/identity:ro

  facility-b:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      store:
        condition: service_healthy
      audit:
        condition: service_healthy
      pki:
        condition: service_completed_successfully
    environment:
      HOST: "0.0.0.0"  # bind inside the bridge; host access below is loopback-only (F16)
      SERVICE_ROLE: facility
      PORT: "8002"
      FACILITY_ID: facility-b
      FEDERATION_ROOT_CERT: /trust/root.crt
      FACILITY_CA_CERTS_DIR: /trust/facility-cas
      DATABASE_URL: postgresql://postgres@store:5432/ehr
      PGPASSWORD: "${POSTGRES_PASSWORD}"
      AUDIT_SERVICE_URL: "${AUDIT_SERVICE_URL:-http://audit:8020}"
      # The forced rotation at expiry re-authors the policy at the
      # authorities and hands new shares to the custodian (ADR-0069).
      AUTHORITY_URLS: "${AUTHORITY_URLS:-authority-med=http://authority-med:8010,authority-net=http://authority-net:8011}"
      CUSTODIAN_URL: "${CUSTODIAN_URL:-http://custodian:8030}"
      SERVICE_KEY_FILE: /identity/service.key
      SERVICE_CERT_FILE: /identity/service.crt
      TLS_ENABLED: "${TLS_ENABLED:-false}"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8002), 2).close()"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:8002:8002"
    networks: [federation]
    volumes:
      - ../wire/certs/facility-b:/tls/facility-b:ro
      - ../wire/certs/trust:/tls/trust:ro
      - ./pki/trust:/trust:ro
      - ./pki/services/facility-b:/identity:ro

  custodian:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      audit:
        condition: service_healthy
      facility-a:
        condition: service_healthy
      facility-b:
        condition: service_healthy
    environment:
      HOST: "0.0.0.0"  # bind inside the bridge; host access below is loopback-only (F16)
      SERVICE_ROLE: custodian
      PORT: "8030"
      DATABASE_URL: postgresql://postgres@store:5432/ehr
      PGPASSWORD: "${POSTGRES_PASSWORD}"
      AUDIT_SERVICE_URL: "${AUDIT_SERVICE_URL:-http://audit:8020}"
      AUTHORITY_URLS: "${AUTHORITY_URLS:-authority-med=http://authority-med:8010,authority-net=http://authority-net:8011}"
      FACILITY_URLS: "${FACILITY_URLS:-facility-a=http://facility-a:8001,facility-b=http://facility-b:8002}"
      SERVICE_KEY_FILE: /identity/service.key
      SERVICE_CERT_FILE: /identity/service.crt
      FEDERATION_ROOT_CERT: /trust/root.crt
      TLS_ENABLED: "${TLS_ENABLED:-false}"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8030), 2).close()"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:8030:8030"
    networks: [federation]
    volumes:
      - ../wire/certs/custodian:/tls/custodian:ro
      - ../wire/certs/trust:/tls/trust:ro
      - ./pki/services/custodian:/identity:ro
      - ./pki/trust:/trust:ro

  bootstrap:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    entrypoint: ["python", "-m", "deploy.compose_bootstrap"]
    user: root  # writes the host bind mount ./pki
    depends_on:
      pki:
        condition: service_completed_successfully
      authority-med:
        condition: service_healthy
      authority-net:
        condition: service_healthy
      audit:
        condition: service_healthy
      facility-a:
        condition: service_healthy
      facility-b:
        condition: service_healthy
      custodian:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres@store:5432/ehr
      PGPASSWORD: "${POSTGRES_PASSWORD}"
      AUDIT_SERVICE_URL: "${AUDIT_SERVICE_URL:-http://audit:8020}"
      AUTHORITY_MED_URL: "${AUTHORITY_MED_URL:-http://authority-med:8010}"
      AUTHORITY_NET_URL: "${AUTHORITY_NET_URL:-http://authority-net:8011}"
      FACILITY_A_URL: "${FACILITY_A_URL:-http://facility-a:8001}"
      FACILITY_B_URL: "${FACILITY_B_URL:-http://facility-b:8002}"
      CUSTODIAN_URL: "${CUSTODIAN_URL:-http://custodian:8030}"
      TLS_ENABLED: "${TLS_ENABLED:-false}"
      SEED_DATA: "${SEED_DATA:-true}"
    volumes:
      - ./pki:/pki
      - ../wire/certs/trust:/tls/trust:ro
    networks: [federation]

  portal:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    entrypoint: ["python", "-m", "deploy.seed_portal", "--host", "0.0.0.0"]
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://postgres@store:5432/ehr
      PGPASSWORD: "${POSTGRES_PASSWORD}"
      CUSTODIAN_URL: http://custodian:8030
      AUDIT_SERVICE_URL: http://audit:8020
      AUTHORITY_URLS: authority-med=http://authority-med:8010,authority-net=http://authority-net:8011
      FACILITY_URLS: facility-a=http://facility-a:8001,facility-b=http://facility-b:8002
      TLS_ENABLED: "${TLS_ENABLED:-false}"
      EMERGENCY_DURATION_SECONDS: "${EMERGENCY_DURATION_SECONDS:-14400}"
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: "127.0.0.1,localhost"
      # Signs the portal's calls; holds no subject key (ADR-0066, ADR-0014).
      SERVICE_KEY_FILE: /identity/service.key
      SERVICE_CERT_FILE: /identity/service.crt
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/accounts/login/', timeout=3)"]
      interval: 3s
      timeout: 5s
      retries: 30
    volumes:
      - ../wire/certs/trust:/tls/trust:ro
      - ./pki/services/portal:/identity:ro
    networks: [federation]

networks:
  federation: {}
