# Path B: Docker Compose deployment (P4-3, ARCHITECTURE.md §7).
#
# Plain HTTP is the default capture mode.
# TLS is enabled with TLS_ENABLED=true for the P4-6 defense-in-depth mode.
#
# The portal starts after bootstrap succeeds and is served at localhost:8000.
# Published database and service ports are restricted to loopback (review F16).
# This is a disposable local demo, not an internet-facing deployment.
# For verified federation TLS: python -m wire.tls, then TLS_ENABLED=true.
# Recreate the entire stack after key-service restarts; keys are ephemeral.
# The store requires POSTGRES_PASSWORD (deploy/.env, git-ignored). Each service
# mounts only its own TLS key plus the shared trust bundle (ADR-0047).
#
# Every service keeps its keys in memory, so the federation is fresh whenever
# the stack starts (ADR-0039): the store lives in tmpfs and is empty on each
# start, and `bootstrap` seeds the synthetic dataset into it (SEED_DATA=false
# skips that). Re-running `up` on a running stack leaves it alone.

services:
  store:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ehr
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env, see deploy/README.md}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ehr"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:55433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    networks: [federation]

  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      store:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres@store:5432/ehr
      PGPASSWORD: "${POSTGRES_PASSWORD}"
    entrypoint: ["python", "-m", "storage.migrate"]
    networks: [federation]

  authority-med:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      HOST: "0.0.0.0"  # bind inside the bridge; host access below is loopback-only (F16)
      SERVICE_ROLE: authority
      PORT: "8010"
      AUTHORITY_ID: authority-med
      OWNED_ATTRIBUTES: role
      TLS_ENABLED: "${TLS_ENABLED:-false}"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8010), 2).close()"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:8010:8010"
    networks: [federation]
    volumes:
      - ../wire/certs/authority-med:/tls/authority-med:ro
      - ../wire/certs/trust:/tls/trust:ro

  authority-net:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      HOST: "0.0.0.0"  # bind inside the bridge; host access below is loopback-only (F16)
      SERVICE_ROLE: authority
      PORT: "8011"
      AUTHORITY_ID: authority-net
      OWNED_ATTRIBUTES: "specialty,facility,owner"
      TLS_ENABLED: "${TLS_ENABLED:-false}"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8011), 2).close()"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:8011:8011"
    networks: [federation]
    volumes:
      - ../wire/certs/authority-net:/tls/authority-net:ro
      - ../wire/certs/trust:/tls/trust:ro

  audit:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      store:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      HOST: "0.0.0.0"  # bind inside the bridge; host access below is loopback-only (F16)
      SERVICE_ROLE: audit
      PORT: "8020"
      DATABASE_URL: postgresql://postgres@store:5432/ehr
      PGPASSWORD: "${POSTGRES_PASSWORD}"
      AUDIT_ACTOR_ID: audit-service
      TLS_ENABLED: "${TLS_ENABLED:-false}"
      TLS_VERIFY: "${TLS_VERIFY:-true}"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8020), 2).close()"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:8020:8020"
    networks: [federation]
    volumes:
      - ../wire/certs/audit:/tls/audit:ro
      - ../wire/certs/trust:/tls/trust:ro

  facility-a:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      store:
        condition: service_healthy
      audit:
        condition: service_healthy
    environment:
      HOST: "0.0.0.0"  # bind inside the bridge; host access below is loopback-only (F16)
      SERVICE_ROLE: facility
      PORT: "8001"
      FACILITY_ID: facility-a
      DATABASE_URL: postgresql://postgres@store:5432/ehr
      PGPASSWORD: "${POSTGRES_PASSWORD}"
      AUDIT_SERVICE_URL: "${AUDIT_SERVICE_URL:-http://audit:8020}"
      TLS_ENABLED: "${TLS_ENABLED:-false}"
      TLS_VERIFY: "${TLS_VERIFY:-true}"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8001), 2).close()"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:8001:8001"
    networks: [federation]
    volumes:
      - ../wire/certs/facility-a:/tls/facility-a:ro
      - ../wire/certs/trust:/tls/trust:ro

  facility-b:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      store:
        condition: service_healthy
      audit:
        condition: service_healthy
    environment:
      HOST: "0.0.0.0"  # bind inside the bridge; host access below is loopback-only (F16)
      SERVICE_ROLE: facility
      PORT: "8002"
      FACILITY_ID: facility-b
      DATABASE_URL: postgresql://postgres@store:5432/ehr
      PGPASSWORD: "${POSTGRES_PASSWORD}"
      AUDIT_SERVICE_URL: "${AUDIT_SERVICE_URL:-http://audit:8020}"
      TLS_ENABLED: "${TLS_ENABLED:-false}"
      TLS_VERIFY: "${TLS_VERIFY:-true}"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8002), 2).close()"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:8002:8002"
    networks: [federation]
    volumes:
      - ../wire/certs/facility-b:/tls/facility-b:ro
      - ../wire/certs/trust:/tls/trust:ro

  custodian:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      audit:
        condition: service_healthy
      facility-a:
        condition: service_healthy
      facility-b:
        condition: service_healthy
    environment:
      HOST: "0.0.0.0"  # bind inside the bridge; host access below is loopback-only (F16)
      SERVICE_ROLE: custodian
      PORT: "8030"
      DATABASE_URL: postgresql://postgres@store:5432/ehr
      PGPASSWORD: "${POSTGRES_PASSWORD}"
      AUDIT_SERVICE_URL: "${AUDIT_SERVICE_URL:-http://audit:8020}"
      AUTHORITY_URLS: "${AUTHORITY_URLS:-authority-med=http://authority-med:8010,authority-net=http://authority-net:8011}"
      FACILITY_URLS: "${FACILITY_URLS:-facility-a=http://facility-a:8001,facility-b=http://facility-b:8002}"
      TLS_ENABLED: "${TLS_ENABLED:-false}"
      TLS_VERIFY: "${TLS_VERIFY:-true}"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8030), 2).close()"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:8030:8030"
    networks: [federation]
    volumes:
      - ../wire/certs/custodian:/tls/custodian:ro
      - ../wire/certs/trust:/tls/trust:ro

  bootstrap:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    entrypoint: ["python", "-m", "deploy.compose_bootstrap"]
    depends_on:
      authority-med:
        condition: service_healthy
      authority-net:
        condition: service_healthy
      audit:
        condition: service_healthy
      facility-a:
        condition: service_healthy
      facility-b:
        condition: service_healthy
      custodian:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres@store:5432/ehr
      PGPASSWORD: "${POSTGRES_PASSWORD}"
      AUDIT_SERVICE_URL: "${AUDIT_SERVICE_URL:-http://audit:8020}"
      AUTHORITY_MED_URL: "${AUTHORITY_MED_URL:-http://authority-med:8010}"
      AUTHORITY_NET_URL: "${AUTHORITY_NET_URL:-http://authority-net:8011}"
      FACILITY_A_URL: "${FACILITY_A_URL:-http://facility-a:8001}"
      FACILITY_B_URL: "${FACILITY_B_URL:-http://facility-b:8002}"
      CUSTODIAN_URL: "${CUSTODIAN_URL:-http://custodian:8030}"
      TLS_ENABLED: "${TLS_ENABLED:-false}"
      SEED_DATA: "${SEED_DATA:-true}"
      TLS_VERIFY: "${TLS_VERIFY:-true}"
    volumes:
      - ./pki:/pki
      - ../wire/certs/trust:/tls/trust:ro
    networks: [federation]

  portal:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    entrypoint: ["python", "-m", "deploy.seed_portal", "--host", "0.0.0.0"]
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://postgres@store:5432/ehr
      PGPASSWORD: "${POSTGRES_PASSWORD}"
      CUSTODIAN_URL: http://custodian:8030
      AUDIT_SERVICE_URL: http://audit:8020
      AUTHORITY_URLS: authority-med=http://authority-med:8010,authority-net=http://authority-net:8011
      FACILITY_URLS: facility-a=http://facility-a:8001,facility-b=http://facility-b:8002
      TLS_ENABLED: "${TLS_ENABLED:-false}"
      EMERGENCY_DURATION_SECONDS: "${EMERGENCY_DURATION_SECONDS:-120}"
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: "127.0.0.1,localhost"
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/accounts/login/', timeout=3)"]
      interval: 3s
      timeout: 5s
      retries: 30
    volumes:
      - ../wire/certs/trust:/tls/trust:ro
    networks: [federation]

networks:
  federation: {}
