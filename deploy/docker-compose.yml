# Path B: Docker Compose deployment (P4-3, ARCHITECTURE.md §7).
#
# Six processes: the shared Postgres store, two facilities, two attribute
# authorities, and the audit service -- plus a one-shot `bootstrap` service
# that performs PKI generation, authority registration, and the hard boot
# precondition (the audit chain must verify) once every other service
# reports healthy.
#
# Inter-service traffic is plain HTTP by default -- this *is* the
# `capture-plain` profile PROJECT.md §4A's traffic-analysis module captures
# against, deliberately: confidentiality here comes from the
# application-layer encryption (crypto_core/records/pre), not from
# transport security. TLS between services (the `capture-tls` defence-in-
# depth profile) is P4-6's addition, not this one's.
#
# Up:   docker compose -f deploy/docker-compose.yml up --build
# Logs: docker compose -f deploy/docker-compose.yml logs -f
# Down: docker compose -f deploy/docker-compose.yml down -v

services:
  store:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ehr
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ehr"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - store-data:/var/lib/postgresql/data
    networks: [federation]

  authority-med:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      SERVICE_ROLE: authority
      PORT: "8010"
      AUTHORITY_ID: authority-med
      OWNED_ATTRIBUTES: role
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8010/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [federation]

  authority-net:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      SERVICE_ROLE: authority
      PORT: "8011"
      AUTHORITY_ID: authority-net
      OWNED_ATTRIBUTES: "specialty,facility,owner"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8011/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [federation]

  audit:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      store:
        condition: service_healthy
    environment:
      SERVICE_ROLE: audit
      PORT: "8020"
      DATABASE_URL: postgresql://postgres@store:5432/ehr
      AUDIT_ACTOR_ID: audit-service
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8020/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [federation]

  facility-a:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      store:
        condition: service_healthy
      audit:
        condition: service_healthy
    environment:
      SERVICE_ROLE: facility
      PORT: "8001"
      FACILITY_ID: facility-a
      DATABASE_URL: postgresql://postgres@store:5432/ehr
      AUDIT_SERVICE_URL: http://audit:8020
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8001/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [federation]

  facility-b:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      store:
        condition: service_healthy
      audit:
        condition: service_healthy
    environment:
      SERVICE_ROLE: facility
      PORT: "8002"
      FACILITY_ID: facility-b
      DATABASE_URL: postgresql://postgres@store:5432/ehr
      AUDIT_SERVICE_URL: http://audit:8020
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8002/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [federation]

  bootstrap:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    entrypoint: ["python", "-m", "deploy.compose_bootstrap"]
    depends_on:
      authority-med:
        condition: service_healthy
      authority-net:
        condition: service_healthy
      audit:
        condition: service_healthy
      facility-a:
        condition: service_healthy
      facility-b:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres@store:5432/ehr
      AUDIT_SERVICE_URL: http://audit:8020
      AUTHORITY_MED_URL: http://authority-med:8010
      AUTHORITY_NET_URL: http://authority-net:8011
      FACILITY_A_URL: http://facility-a:8001
      FACILITY_B_URL: http://facility-b:8002
    volumes:
      - ./pki:/pki
    networks: [federation]

networks:
  federation: {}

volumes:
  store-data: {}
