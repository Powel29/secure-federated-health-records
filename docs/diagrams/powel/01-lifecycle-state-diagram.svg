<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 676" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474f"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c62828"/>
    </marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#90a4ae"/>
    </marker>
  </defs>
  <rect width="980" height="676" fill="#ffffff"/>
  <text x="490" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a1a">Key-lifecycle state machine (one record)</text>
  <text x="490" y="58" text-anchor="middle" font-size="13" fill="#546e7a">src/lifecycle/state_machine.py &#183; LEGAL_TRANSITIONS &#183; four states, seven legal arrows &#183; consent is not a state</text>

  <!-- states -->
  <g stroke-width="2.5">
    <rect x="170" y="120" width="210" height="84" rx="14" fill="#fdecea" stroke="#c62828"/>
    <rect x="170" y="440" width="210" height="84" rx="14" fill="#e6f4ea" stroke="#2e7d32"/>
    <rect x="450" y="275" width="230" height="96" rx="14" fill="#fff4e0" stroke="#ef6c00"/>
    <rect x="770" y="275" width="170" height="96" rx="14" fill="#eceff1" stroke="#546e7a"/>
  </g>
  <g text-anchor="middle" fill="#1a1a1a">
    <text x="275" y="156" font-size="19" font-weight="700">REVOKED</text>
    <text x="275" y="178" font-size="12">patient revoked, full rotation</text>
    <text x="275" y="482" font-size="19" font-weight="700">GRANTED</text>
    <text x="275" y="504" font-size="12">baseline (set at ingest)</text>
    <text x="565" y="315" font-size="19" font-weight="700">EMERGENCY_OPEN</text>
    <text x="565" y="337" font-size="12">time-boxed break-glass</text>
    <text x="565" y="355" font-size="12">3-of-4 gate passed, no rotation</text>
    <text x="855" y="315" font-size="19" font-weight="700">EXPIRED</text>
    <text x="855" y="337" font-size="12">window closed,</text>
    <text x="855" y="355" font-size="12">full rotation runs</text>
  </g>

  <!-- start marker -->
  <circle cx="90" cy="482" r="9" fill="#37474f"/>
  <path d="M99,482 H168" stroke="#37474f" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <text x="90" y="510" text-anchor="middle" font-size="11" fill="#546e7a">ingest</text>

  <!-- arrows -->
  <g fill="none" stroke="#37474f" stroke-width="2.2">
    <!-- 1 GRANTED -> REVOKED -->
    <path d="M235,440 V206" marker-end="url(#ar)"/>
  </g>
  <g fill="none" stroke="#90a4ae" stroke-width="2.2" stroke-dasharray="7 5">
    <!-- 2 REVOKED -> GRANTED (legal, never emitted) -->
    <path d="M315,204 V438" marker-end="url(#arg)"/>
  </g>
  <g fill="none" stroke="#c62828" stroke-width="2.4">
    <!-- 3 GRANTED -> EMERGENCY -->
    <path d="M380,482 H565 V373" marker-end="url(#arr)"/>
    <!-- 4 REVOKED -> EMERGENCY -->
    <path d="M380,162 H565 V273" marker-end="url(#arr)"/>
  </g>
  <g fill="none" stroke="#37474f" stroke-width="2.2">
    <!-- 5 EMERGENCY -> EXPIRED -->
    <path d="M680,323 H768" marker-end="url(#ar)"/>
    <!-- 6 EXPIRED -> GRANTED -->
    <path d="M820,373 V600 H275 V526" marker-end="url(#ar)"/>
    <!-- 7 EXPIRED -> REVOKED -->
    <path d="M925,273 V98 H275 V118" marker-end="url(#ar)"/>
  </g>

  <!-- arrow labels -->
  <g font-size="12.5" fill="#1a1a1a">
    <text x="224" y="330" text-anchor="end" font-weight="700">1 revoke</text>
    <text x="224" y="348" text-anchor="end" fill="#546e7a">signed by the patient</text>
    <text x="224" y="364" text-anchor="end" fill="#546e7a">full rotation</text>
    <text x="326" y="320" font-weight="700" fill="#78909c">2 legal, but</text>
    <text x="326" y="338" fill="#78909c">no code emits it</text>

    <text x="395" y="470" font-weight="700" fill="#c62828">3 break-glass</text>
    <text x="575" y="420" fill="#c62828">reason code required</text>
    <text x="395" y="150" font-weight="700" fill="#c62828">4 break-glass on a revoked record</text>
    <text x="575" y="246" fill="#c62828">signed by the clinician</text>

    <text x="724" y="306" text-anchor="middle" font-weight="700">5 timer</text>
    <text x="705" y="342" text-anchor="middle" fill="#546e7a">now &#8805; expires_at</text>

    <text x="545" y="588" text-anchor="middle" font-weight="700">6 full rotation stored, new shares deposited, then back to the prior state</text>
    <text x="545" y="626" text-anchor="middle" fill="#546e7a">timer-signed &#183; if it was GRANTED before the emergency</text>

    <text x="600" y="90" text-anchor="middle" font-weight="700">7 same, if it was REVOKED before (or the patient revokes while EXPIRED)</text>
  </g>

  <!-- notes -->
  <g font-size="12.5" fill="#1a1a1a">
    <text x="600" y="132" font-weight="700" fill="#c62828">Illegal (IllegalTransitionError, nothing signed):</text>
    <text x="600" y="150" fill="#37474f">self-transitions, GRANTED &#8594; EXPIRED, any exit</text>
    <text x="600" y="167" fill="#37474f">from EMERGENCY_OPEN except to EXPIRED</text>
  </g>
  <g font-size="11.5" fill="#546e7a">
    <text x="30" y="648">Every arrow is a signed TransitionEvent: domain tag ehr/transition-event/v1, length-prefixed fields, ECDSA P-256, single-use event_id.</text>
    <text x="30" y="664">Signed by: patient (revoke), clinician (break-glass), timer-service key (expiry). Apply order: signature, legality, from-state, consume event_id.</text>
  </g>
</svg>
