<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" font-family="Segoe UI, Arial, sans-serif">
  <rect width="980" height="600" fill="#ffffff"/>
  <text x="490" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a1a">Policy tree for rec-002 (our CP-ABE substitute)</text>
  <text x="490" y="58" text-anchor="middle" font-size="13" fill="#546e7a">src/policy &#183; AND = Shamir k-of-k split &#183; OR = same secret given to each branch &#183; leaves encrypted to an authority's attribute key</text>

  <!-- edges -->
  <g stroke="#37474f" stroke-width="2" fill="none">
    <path d="M490,150 L290,230"/>
    <path d="M490,150 L760,300"/>
    <path d="M290,290 L170,380"/>
    <path d="M290,290 L410,380"/>
  </g>

  <!-- root OR -->
  <rect x="410" y="100" width="160" height="50" rx="25" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5"/>
  <text x="490" y="132" text-anchor="middle" font-size="20" font-weight="700" fill="#0d47a1">OR (root)</text>
  <text x="620" y="125" font-size="12" fill="#546e7a">either branch rebuilds the same root secret</text>

  <!-- AND -->
  <rect x="210" y="230" width="160" height="60" rx="30" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5"/>
  <text x="290" y="266" text-anchor="middle" font-size="20" font-weight="700" fill="#0d47a1">AND</text>
  <text x="290" y="216" text-anchor="middle" font-size="12" fill="#546e7a">clinical branch: every child needed</text>

  <!-- leaves -->
  <g stroke-width="2.5">
    <rect x="50" y="380" width="240" height="78" rx="10" fill="#e6f4ea" stroke="#2e7d32"/>
    <rect x="300" y="380" width="260" height="78" rx="10" fill="#e6f4ea" stroke="#2e7d32"/>
    <rect x="640" y="300" width="240" height="78" rx="10" fill="#fff4e0" stroke="#ef6c00"/>
  </g>
  <g text-anchor="middle" fill="#1a1a1a">
    <text x="170" y="414" font-size="17" font-weight="700">role:physician</text>
    <text x="170" y="436" font-size="12" fill="#546e7a">key from authority-med</text>
    <text x="430" y="414" font-size="17" font-weight="700">specialty:endocrinology</text>
    <text x="430" y="436" font-size="12" fill="#546e7a">key from authority-net</text>
    <text x="760" y="334" font-size="17" font-weight="700">owner:pat-102</text>
    <text x="760" y="356" font-size="12" fill="#546e7a">patient self-access</text>
  </g>

  <!-- who can read -->
  <text x="40" y="500" font-size="15" font-weight="700" fill="#1a1a1a">Who can rebuild the root, once consent is granted</text>
  <g font-size="13.5" fill="#1a1a1a">
    <text x="40" y="526"><tspan fill="#2e7d32" font-weight="700">cameron</tspan> (physician + endocrinology)  holds both clinical keys  &#8594; AND met  &#8594; reads</text>
    <text x="40" y="548"><tspan fill="#2e7d32" font-weight="700">david</tspan> (patient, owner:pat-102)  holds the owner key  &#8594; OR met through the owner leaf  &#8594; reads own record</text>
    <text x="40" y="570"><tspan fill="#c62828" font-weight="700">house</tspan> (emergency physician)  lacks specialty:endocrinology  &#8594; AND short, no owner key  &#8594; <tspan font-weight="700">denied, not degraded</tspan></text>
  </g>
  <text x="940" y="590" text-anchor="end" font-size="11" fill="#546e7a">Consent is necessary but not sufficient: the tree is the second lock.</text>
</svg>
