<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474f"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/>
    </marker>
  </defs>
  <rect width="980" height="600" fill="#ffffff"/>
  <text x="490" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a1a">Break-glass 2-of-3 gate (Shamir)</text>
  <text x="490" y="58" text-anchor="middle" font-size="13" fill="#546e7a">src/shamir &#183; src/breakglass &#183; any two shares rebuild the emergency key, one share reveals nothing</text>

  <!-- shares -->
  <g stroke-width="2.5">
    <rect x="40" y="110" width="250" height="120" rx="12" fill="#e3f2fd" stroke="#1565c0"/>
    <rect x="40" y="260" width="250" height="120" rx="12" fill="#f3f3f3" stroke="#90a4ae" stroke-dasharray="7 5"/>
    <rect x="40" y="410" width="250" height="130" rx="12" fill="#fff4e0" stroke="#ef6c00"/>
  </g>
  <g fill="#1a1a1a">
    <text x="60" y="140" font-size="17" font-weight="700">Share 1</text>
    <text x="60" y="162" font-size="13">Attending clinician</text>
    <text x="60" y="180" font-size="13">(held by the Key Custodian)</text>
    <text x="60" y="206" font-size="12" fill="#546e7a">released against a valid assertion</text>

    <text x="60" y="290" font-size="17" font-weight="700" fill="#546e7a">Share 2</text>
    <text x="60" y="312" font-size="13" fill="#546e7a">Patient's home authority</text>
    <text x="60" y="330" font-size="13" fill="#546e7a">(or a federated delegate)</text>
    <text x="60" y="356" font-size="12" fill="#546e7a">not requested in the demo (decision D2)</text>

    <text x="60" y="440" font-size="17" font-weight="700">Share 3</text>
    <text x="60" y="462" font-size="13">Audit service</text>
    <text x="60" y="486" font-size="12" fill="#c62828" font-weight="700">1. WRITE log entry, COMMIT</text>
    <text x="60" y="504" font-size="12" fill="#c62828" font-weight="700">2. only then return the share</text>
    <text x="60" y="526" font-size="12" fill="#546e7a">log fails &#8594; 503, no share</text>
  </g>

  <!-- arrows to combine -->
  <g fill="none" stroke-width="2.6">
    <path d="M290,170 C400,170 430,280 520,290" stroke="#2e7d32" marker-end="url(#ag)"/>
    <path d="M290,470 C400,470 430,330 520,320" stroke="#2e7d32" marker-end="url(#ag)"/>
    <path d="M290,320 H390" stroke="#90a4ae" stroke-dasharray="7 5"/>
  </g>
  <!-- blocked single share -->
  <g stroke="#c62828" stroke-width="4">
    <path d="M388,305 L412,335"/>
    <path d="M412,305 L388,335"/>
  </g>
  <text x="400" y="360" text-anchor="middle" font-size="12" fill="#c62828" font-weight="700">one share alone: nothing</text>

  <!-- combine -->
  <rect x="520" y="255" width="190" height="100" rx="14" fill="#e6f4ea" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="615" y="292" text-anchor="middle" font-size="16" font-weight="700" fill="#1b5e20">combine_shares</text>
  <text x="615" y="314" text-anchor="middle" font-size="13">any 2 of 3</text>
  <text x="615" y="334" text-anchor="middle" font-size="13">&#8594; emergency key</text>
  <path d="M710,305 H770" stroke="#37474f" stroke-width="2.6" fill="none" marker-end="url(#ar)"/>
  <rect x="772" y="255" width="170" height="100" rx="14" fill="#fff4e0" stroke="#ef6c00" stroke-width="2.5"/>
  <text x="857" y="292" text-anchor="middle" font-size="15" font-weight="700">EMERGENCY_OPEN</text>
  <text x="857" y="314" text-anchor="middle" font-size="12">DEK re-wrapped to</text>
  <text x="857" y="332" text-anchor="middle" font-size="12">the clinician (PRE)</text>

  <!-- preconditions -->
  <g>
    <rect x="520" y="395" width="422" height="130" rx="10" fill="#fafafa" stroke="#b0bec5" stroke-width="1.5"/>
    <text x="536" y="420" font-size="14" font-weight="700" fill="#1a1a1a">Also required before any share is requested</text>
    <text x="536" y="444" font-size="13" fill="#37474f">&#8226; Signed Emergency Assertion: bound to one patient, short-lived,</text>
    <text x="536" y="462" font-size="13" fill="#37474f">   single use, fixed reason code (ARCHITECTURE &#167;8)</text>
    <text x="536" y="484" font-size="13" fill="#37474f">&#8226; Patient in the assertion must match the record</text>
    <text x="536" y="506" font-size="13" fill="#37474f">&#8226; Missing, short or garbage shares: raise, never degrade</text>
  </g>
  <text x="40" y="575" font-size="12" fill="#546e7a">Today's demo path presents shares 1 + 3; share 2 is generated but not deposited (review F3 / D2).</text>
</svg>
