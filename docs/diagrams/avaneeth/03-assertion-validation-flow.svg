<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 930" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474f"/>
    </marker>
    <marker id="ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c62828"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/>
    </marker>
  </defs>
  <rect width="1000" height="930" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a1a">Emergency Assertion: checks before any share is released</text>
  <text x="500" y="55" text-anchor="middle" font-size="13" fill="#546e7a">Fails closed at the first failing check, in this order. The one-time id is consumed last, so a forgery cannot burn a real id.</text>
  <text x="500" y="73" text-anchor="middle" font-size="13" fill="#546e7a">The facility, the audit service and the home authority each run it against their own trust anchors and consumed-id store.</text>

  <rect x="60" y="88" width="330" height="40" rx="20" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5"/>
  <text x="225" y="113" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0d47a1">Signed assertion arrives (nonce &gt;= 128 bits)</text>

  <rect x="60" y="150" width="330" height="52" rx="8" fill="#fafafa" stroke="#37474f" stroke-width="2.2"/>
  <text x="74" y="172" font-size="13.5" font-weight="700" fill="#1a1a1a">1  Signature verifies</text>
  <text x="74" y="190" font-size="12" fill="#546e7a">against the clinician certificate's public key</text>
  <path d="M390,176 H520" stroke="#c62828" stroke-width="2" fill="none" marker-end="url(#ae)"/>
  <rect x="520" y="158" width="230" height="36" rx="8" fill="#fdecea" stroke="#c62828" stroke-width="2"/>
  <text x="532" y="181" font-size="12.5" fill="#1a1a1a">refuse: invalid signature</text>
  <rect x="60" y="226" width="330" height="52" rx="8" fill="#fafafa" stroke="#37474f" stroke-width="2.2"/>
  <text x="74" y="248" font-size="13.5" font-weight="700" fill="#1a1a1a">2  Certificate chains to the root</text>
  <text x="74" y="266" font-size="12" fill="#546e7a">via a facility CA to the trusted root</text>
  <path d="M390,252 H520" stroke="#c62828" stroke-width="2" fill="none" marker-end="url(#ae)"/>
  <rect x="520" y="234" width="230" height="36" rx="8" fill="#fdecea" stroke="#c62828" stroke-width="2"/>
  <text x="532" y="257" font-size="12.5" fill="#1a1a1a">refuse: untrusted chain</text>
  <rect x="60" y="302" width="330" height="52" rx="8" fill="#fafafa" stroke="#37474f" stroke-width="2.2"/>
  <text x="74" y="324" font-size="13.5" font-weight="700" fill="#1a1a1a">3  clinician_id = certificate CN</text>
  <text x="74" y="342" font-size="12" fill="#546e7a">no borrowed identity</text>
  <path d="M390,328 H520" stroke="#c62828" stroke-width="2" fill="none" marker-end="url(#ae)"/>
  <rect x="520" y="310" width="230" height="36" rx="8" fill="#fdecea" stroke="#c62828" stroke-width="2"/>
  <text x="532" y="333" font-size="12.5" fill="#1a1a1a">refuse: identity mismatch</text>
  <rect x="60" y="378" width="330" height="52" rx="8" fill="#fafafa" stroke="#37474f" stroke-width="2.2"/>
  <text x="74" y="400" font-size="13.5" font-weight="700" fill="#1a1a1a">4  Certificate not revoked</text>
  <text x="74" y="418" font-size="12" fill="#546e7a">revocation checked</text>
  <path d="M390,404 H520" stroke="#c62828" stroke-width="2" fill="none" marker-end="url(#ae)"/>
  <rect x="520" y="386" width="230" height="36" rx="8" fill="#fdecea" stroke="#c62828" stroke-width="2"/>
  <text x="532" y="409" font-size="12.5" fill="#1a1a1a">refuse: revoked certificate</text>
  <rect x="60" y="454" width="330" height="52" rx="8" fill="#fafafa" stroke="#37474f" stroke-width="2.2"/>
  <text x="74" y="476" font-size="13.5" font-weight="700" fill="#1a1a1a">5  facility_id acceptable</text>
  <text x="74" y="494" font-size="12" fill="#546e7a">facility: this node; share holders: a federation member</text>
  <path d="M390,480 H520" stroke="#c62828" stroke-width="2" fill="none" marker-end="url(#ae)"/>
  <rect x="520" y="462" width="230" height="36" rx="8" fill="#fdecea" stroke="#c62828" stroke-width="2"/>
  <text x="532" y="485" font-size="12.5" fill="#1a1a1a">refuse: wrong facility</text>
  <rect x="60" y="530" width="330" height="52" rx="8" fill="#fafafa" stroke="#37474f" stroke-width="2.2"/>
  <text x="74" y="552" font-size="13.5" font-weight="700" fill="#1a1a1a">6  Not expired</text>
  <text x="74" y="570" font-size="12" fill="#546e7a">strict: expires_at &lt;= now is expired</text>
  <path d="M390,556 H520" stroke="#c62828" stroke-width="2" fill="none" marker-end="url(#ae)"/>
  <rect x="520" y="538" width="230" height="36" rx="8" fill="#fdecea" stroke="#c62828" stroke-width="2"/>
  <text x="532" y="561" font-size="12.5" fill="#1a1a1a">refuse: expired assertion</text>
  <rect x="60" y="606" width="330" height="52" rx="8" fill="#fafafa" stroke="#37474f" stroke-width="2.2"/>
  <text x="74" y="628" font-size="13.5" font-weight="700" fill="#1a1a1a">7  Lifetime and skew</text>
  <text x="74" y="646" font-size="12" fill="#546e7a">lifetime &lt;= 15 min; issued_at &lt;= 30 s in the future</text>
  <path d="M390,632 H520" stroke="#c62828" stroke-width="2" fill="none" marker-end="url(#ae)"/>
  <rect x="520" y="614" width="230" height="36" rx="8" fill="#fdecea" stroke="#c62828" stroke-width="2"/>
  <text x="532" y="637" font-size="12.5" fill="#1a1a1a">refuse: lifetime or skew</text>
  <rect x="60" y="682" width="330" height="52" rx="8" fill="#fafafa" stroke="#37474f" stroke-width="2.2"/>
  <text x="74" y="704" font-size="13.5" font-weight="700" fill="#1a1a1a">8  Consume assertion_id (last)</text>
  <text x="74" y="722" font-size="12" fill="#546e7a">own durable store at each validator</text>
  <path d="M390,708 H520" stroke="#c62828" stroke-width="2" fill="none" marker-end="url(#ae)"/>
  <rect x="520" y="690" width="230" height="36" rx="8" fill="#fdecea" stroke="#c62828" stroke-width="2"/>
  <text x="532" y="713" font-size="12.5" fill="#1a1a1a">refuse: replayed assertion</text>
  <path d="M225,128 V148" stroke="#2e7d32" stroke-width="2.4" fill="none" marker-end="url(#ag)"/>
  <path d="M225,202 V224" stroke="#2e7d32" stroke-width="2.4" fill="none" marker-end="url(#ag)"/>
  <path d="M225,278 V300" stroke="#2e7d32" stroke-width="2.4" fill="none" marker-end="url(#ag)"/>
  <path d="M225,354 V376" stroke="#2e7d32" stroke-width="2.4" fill="none" marker-end="url(#ag)"/>
  <path d="M225,430 V452" stroke="#2e7d32" stroke-width="2.4" fill="none" marker-end="url(#ag)"/>
  <path d="M225,506 V528" stroke="#2e7d32" stroke-width="2.4" fill="none" marker-end="url(#ag)"/>
  <path d="M225,582 V604" stroke="#2e7d32" stroke-width="2.4" fill="none" marker-end="url(#ag)"/>
  <path d="M225,658 V680" stroke="#2e7d32" stroke-width="2.4" fill="none" marker-end="url(#ag)"/>
  <path d="M225,734 V756" stroke="#2e7d32" stroke-width="2.4" fill="none" marker-end="url(#ag)"/>
  <rect x="60" y="758" width="330" height="66" rx="8" fill="#fff4e0" stroke="#ef6c00" stroke-width="2.2"/>
  <text x="74" y="780" font-size="13.5" font-weight="700" fill="#1a1a1a">9  Record belongs to the patient named</text>
  <text x="74" y="798" font-size="12" fill="#546e7a">facility only (and the custodian); no share holder checks it</text>
  <text x="74" y="814" font-size="12" fill="#546e7a">+ clinical-context digest names this record (ADR-0044, 0067)</text>
  <path d="M390,791 H520" stroke="#c62828" stroke-width="2" fill="none" marker-end="url(#ae)"/>
  <rect x="520" y="767" width="450" height="48" rx="8" fill="#fdecea" stroke="#c62828" stroke-width="2"/>
  <text x="532" y="788" font-size="12.5" font-weight="700" fill="#c62828">HTTP 403, denial written to the audit chain,</text>
  <text x="532" y="805" font-size="12.5" font-weight="700" fill="#c62828">no state change, no share released</text>
  <path d="M225,824 V858" stroke="#2e7d32" stroke-width="2.4" fill="none"/>
  <path d="M225,858 H520" stroke="#2e7d32" stroke-width="2.6" fill="none" marker-end="url(#ag)"/>
  <rect x="520" y="834" width="450" height="62" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="534" y="858" font-size="14" font-weight="700" fill="#1b5e20">All pass: the audit service commits its entry, then seals</text>
  <text x="534" y="876" font-size="12.5" fill="#1a1a1a">shares 3 and 4; the facility combines three shares into the emergency key.</text>
</svg>
