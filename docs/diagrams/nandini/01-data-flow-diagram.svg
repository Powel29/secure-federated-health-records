<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474f"/>
    </marker>
    <marker id="ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c62828"/>
    </marker>
  </defs>
  <rect width="1000" height="640" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a1a">Data-flow diagram, level 1: a cross-hospital break-glass</text>
  <text x="500" y="55" text-anchor="middle" font-size="13" fill="#546e7a">Rectangles are people, rounded boxes are processes, the open box is the data store</text>

  <!-- external entities -->
  <g stroke-width="2.5" fill="#f3f3f3" stroke="#90a4ae">
    <rect x="30" y="250" width="150" height="60"/>
    <rect x="30" y="460" width="150" height="60"/>
    <rect x="820" y="460" width="150" height="60"/>
  </g>
  <g text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a1a">
    <text x="105" y="286">Clinician</text>
    <text x="105" y="496">Patient</text>
    <text x="895" y="496">Auditor</text>
  </g>

  <!-- processes -->
  <g stroke-width="2.5">
    <rect x="300" y="230" width="190" height="100" rx="30" fill="#e6f4ea" stroke="#2e7d32"/>
    <rect x="300" y="440" width="190" height="100" rx="30" fill="#e3f2fd" stroke="#1565c0"/>
    <rect x="590" y="230" width="190" height="100" rx="30" fill="#fff4e0" stroke="#ef6c00"/>
    <rect x="590" y="90" width="190" height="90" rx="30" fill="#f3e5f5" stroke="#6a1b9a"/>
  </g>
  <g text-anchor="middle" fill="#1a1a1a">
    <text x="395" y="264" font-size="15" font-weight="700">P1 Facility node</text>
    <text x="395" y="286" font-size="12">identify, discover, validate</text>
    <text x="395" y="304" font-size="12">assertion, unlock, search</text>
    <text x="395" y="474" font-size="15" font-weight="700">P2 Key custodian</text>
    <text x="395" y="496" font-size="12">signs assertions and events,</text>
    <text x="395" y="514" font-size="12">holds share 1 and credentials</text>
    <text x="685" y="264" font-size="15" font-weight="700" fill="#e65100">P3 Audit service</text>
    <text x="685" y="286" font-size="12">commit log entry first,</text>
    <text x="685" y="304" font-size="12">then release share 3</text>
    <text x="685" y="124" font-size="15" font-weight="700">P4 Authorities</text>
    <text x="685" y="146" font-size="12">issue attribute keys</text>
    <text x="685" y="164" font-size="12">(role, specialty, owner)</text>
  </g>

  <!-- data store -->
  <path d="M600,545 H780 M600,590 H780" stroke="#546e7a" stroke-width="3"/>
  <text x="690" y="573" text-anchor="middle" font-size="15" font-weight="700">D1 Postgres store</text>
  <text x="690" y="610" text-anchor="middle" font-size="12" fill="#c62828" font-weight="700">ciphertext, wrapped keys, coded index, chain</text>

  <!-- flows -->
  <g font-size="12.5" fill="#1a1a1a" stroke-linecap="round">
    <path d="M180,270 H298" stroke="#37474f" stroke-width="2.2" fill="none" marker-end="url(#ar)"/>
    <text x="238" y="256" text-anchor="middle">identify, discover</text>
    <text x="238" y="289" text-anchor="middle">(ids only), declare</text>

    <path d="M298,312 H182" stroke="#37474f" stroke-width="2.2" fill="none" marker-end="url(#ar)"/>
    <text x="240" y="328" text-anchor="middle">record, search, countdown</text>

    <path d="M395,330 V438" stroke="#37474f" stroke-width="2.2" fill="none" marker-end="url(#ar)"/>
    <text x="405" y="390">request</text>
    <text x="405" y="406">assertion</text>
    <path d="M365,438 V332" stroke="#37474f" stroke-width="2.2" fill="none" marker-end="url(#ar)"/>
    <text x="357" y="390" text-anchor="end">signed assertion,</text>
    <text x="357" y="406" text-anchor="end">shares 1 + 3</text>

    <path d="M490,470 C560,470 590,400 620,332" stroke="#37474f" stroke-width="2.2" fill="none" marker-end="url(#ar)"/>
    <text x="520" y="430">release share 3</text>
    <path d="M490,300 H588" stroke="#37474f" stroke-width="2.2" fill="none" marker-end="url(#ar)"/>
    <text x="539" y="292" text-anchor="middle">log entry</text>

    <path d="M685,230 V182" stroke="#37474f" stroke-width="2.2" fill="none" marker-end="url(#ar)"/>
    <text x="695" y="206">attribute keys</text>

    <path d="M685,330 V543" stroke="#c62828" stroke-width="2.4" fill="none" marker-end="url(#ae)"/>
    <text x="695" y="440" fill="#c62828" font-weight="700">COMMIT</text>
    <text x="695" y="456" fill="#c62828">log entry</text>

    <path d="M300,330 C250,420 250,560 600,568" stroke="#37474f" stroke-width="2.2" fill="none" marker-end="url(#ar)"/>
    <text x="150" y="560">ciphertext,</text>
    <text x="150" y="576">wrapped keys,</text>
    <text x="150" y="592">coded index</text>

    <path d="M180,490 H298" stroke="#37474f" stroke-width="2.2" fill="none" marker-end="url(#ar)"/>
    <text x="240" y="482" text-anchor="middle">approve / revoke</text>

    <path d="M820,490 C760,490 740,350 690,332" stroke="#37474f" stroke-width="2.2" fill="none" marker-end="url(#ar)"/>
    <text x="870" y="448" text-anchor="middle">verify chain,</text>
    <text x="870" y="464" text-anchor="middle">trace a flow</text>
  </g>
</svg>
