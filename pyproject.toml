[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-federated-health-records"
version = "0.1.0"
description = "Secure Federated Health Records (T01 Scaffold)"
requires-python = ">=3.11"
dependencies = [
    "cryptography",
    "fastapi",
    "uvicorn[standard]",
    "pandas",
    "matplotlib",
    "pyshark",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "ruff",
]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
