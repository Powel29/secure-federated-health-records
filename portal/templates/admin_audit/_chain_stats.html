<div class="grid-stats right">
  <div><div class="kicker">Chain length</div><div class="stat">{{ stats.length }}</div></div>
  <div><div class="kicker">Verified from genesis</div>
    {% if verify.ok and verify.verified %}<div class="stat stat-ok">PASS</div><div class="tiny text-muted">head seq {{ verify.head_seq }}</div>
    {% elif verify.ok %}<div class="stat stat-bad">FAIL</div>
    {% else %}<div class="stat stat-bad">UNREACHABLE</div><div class="tiny text-muted">{{ verify.detail|truncatechars:60 }}</div>{% endif %}</div>
  <div><div class="kicker">Break-glass cases</div><div class="stat">{{ cases_total|default:flows|length }}</div></div>
</div>
