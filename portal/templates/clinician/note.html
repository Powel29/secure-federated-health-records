{% extends "base.html" %}
{% block content %}<section class="card"><h1>Write clinical note</h1><p>Patient {{ case.patient_id }} · encounter {{ case.episode_id }}</p>
{% if error %}<p role="alert">{{ error }}</p>{% endif %}
<form method="post">{% csrf_token %}<label>Title<input class="input" name="title" required maxlength="200"></label><label>Clinical date<input class="input" name="clinical_date" type="date" value="{{ today }}" max="{{ today }}" required></label><label>Note<textarea class="input" name="content" required></textarea></label>
<label>Confidentiality<select class="input" name="sensitivity"><option value="general">General</option><option value="mental_health">Mental health</option><option value="hiv">HIV</option><option value="substance_use">Substance use</option><option value="restricted">Other restricted</option></select></label><button class="btn btn-primary">Save encrypted, attributed note</button></form></section>{% endblock %}
