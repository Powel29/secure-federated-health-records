{% extends "base.html" %}
{% block content %}
<div class="p-4 bg-body rounded shadow-sm">
  <h1 class="h4">Welcome to the Federated EHR portal</h1>
  <p class="text-muted">Choose how to sign in or register.</p>
  <div class="d-flex gap-2 flex-wrap">
    <a class="btn btn-primary" href="{% url 'accounts:register_patient' %}">Register as patient</a>
    <a class="btn btn-primary" href="{% url 'accounts:register_clinician' %}">Register as clinician</a>
    <a class="btn btn-outline-secondary" href="{% url 'accounts:login' %}">Log in</a>
  </div>
</div>
{% endblock %}
